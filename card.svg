<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <clipPath id="cover">
      <rect x="28" y="55" width="150" height="150" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" rx="22" fill="url(#bg)"/>

  <!-- Spotify logo -->
  <circle cx="48" cy="32" r="13" fill="#1DB954"/>
  <path
    d="M42 29.5 C47 27.5 53 28 56 30"
    stroke="#000"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"/>
  <path
    d="M43 33 C47 31.5 52 32 55 34"
    stroke="#000"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"/>

  <text x="70" y="38"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="700">
    Spotify
  </text>

  <!-- Album artwork -->
  <image
    x="28"
    y="55"
    width="150"
    height="150"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#cover)"
    href="https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/d0/06/1f/d0061f04-bcae-f9a1-8126-830c04fa32db/196871971188.jpg/600x600bb.jpg"
  />

  <!-- Song information -->
  <text x="205" y="78"
        fill="#b3b3b3"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="2">
    NOW PLAYING
  </text>

  <text x="205" y="118"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="34"
        font-weight="700">
    Earrings
  </text>

  <text x="205" y="145"
        fill="#b3b3b3"
        font-family="Arial, sans-serif"
        font-size="18">
    Malcolm Todd
  </text>

  <!-- Progress bar -->
  <rect x="205" y="175" width="540" height="5" rx="3" fill="#535353"/>
  <rect x="205" y="175" width="184" height="5" rx="3" fill="#ffffff"/>

  <text x="205" y="198"
        fill="#b3b3b3"
        font-family="Arial, sans-serif"
        font-size="11">
    0:52
  </text>

  <text x="725" y="198"
        fill="#b3b3b3"
        font-family="Arial, sans-serif"
        font-size="11">
    2:31
  </text>

  <!-- Spotify button -->
  <rect x="205" y="215" width="180" height="30" rx="15" fill="#1DB954"/>

  <text x="295" y="235"
        fill="#000000"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="700"
        text-anchor="middle">
    ▶  Open in Spotify
  </text>

</svg>